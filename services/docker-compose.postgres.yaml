services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KC_DB_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql
    labels:
      - "traefik.enable=false"
    networks:
      - keycloak-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --quiet --dbname=keycloak --username=keycloak || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  web:
    external: true
  keycloak-net:
    external: true
