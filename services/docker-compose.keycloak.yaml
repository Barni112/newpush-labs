services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    restart: unless-stopped
    environment:
      - KC_HEALTH_ENABLED=true
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
      - KC_HOSTNAME=kcauth.${DOMAIN}
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_BACKCHANNEL=false
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
      - KC_HTTP_PORT=8080
      - KC_LOG_LEVEL=info
    command: start
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`kcauth.${DOMAIN}`)"
      - "traefik.http.routers.keycloak.entrypoints=https"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      - "traefik.http.routers.keycloak.service=keycloak"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.routers.keycloak.tls.certresolver=default"
    networks:
      - web
      - keycloak-net
    depends_on:
      - keycloak-postgres
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && timeout --preserve-status 1 cat <&3 | grep -m 1 -q 'HTTP/1.0 200'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1200s

  keycloak-postgres:
    image: postgres:18
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KC_DB_PASSWORD}
    volumes:
      - ./keycloak-postgres:/var/lib/postgresql
    networks:
      - keycloak-net
#    healthcheck:
#      test: ["CMD-SHELL, pg_isready -U keycloak"]
#      interval: 30s
#      timeout: 30s
#      retries: 5
#      start_period: 120s

networks:
  web:
    external: true
  keycloak-net:
    external: true